<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Etichette · ZD621</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17181b;
    --panel: #212327;
    --panel-2: #26282d;
    --line: #34363b;
    --amber: #f2a33d;
    --amber-dim: #7a5a29;
    --text: #eae7e1;
    --text-dim: #8b8e94;
    --paper: #f7f5ef;
    --paper-line: #cfcabd;
    --danger: #e2604f;
    --ok: #6fbf73;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: 92px;
  }
  .topbar{
    position: sticky; top:0; z-index: 20;
    background: linear-gradient(180deg, #1b1c20 0%, #1b1c20cc 85%, transparent);
    backdrop-filter: blur(6px);
    padding: 14px 16px 10px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom: 1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:30px;height:30px;border-radius:7px;
    background: var(--amber);
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 0 0 1px #00000030 inset;
  }
  .brand .mark svg{width:16px;height:16px;}
  .brand h1{font-size:15px; font-weight:800; letter-spacing:.2px; margin:0;}
  .brand .sub{font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono', monospace;}
  .status{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color: var(--text-dim);
    padding:6px 10px; border-radius: 20px; background: var(--panel-2); border:1px solid var(--line);
  }
  .dot{width:8px;height:8px;border-radius:50%; background:#555; transition: background .2s;}
  .dot.on{background: var(--ok); box-shadow: 0 0 8px #6fbf7390;}
  .dot.err{background: var(--danger);}

  main{max-width: 560px; margin: 0 auto; padding: 18px 16px 8px;}
  section{margin-bottom: 22px;}
  h2{
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--text-dim); font-weight:700; margin: 0 0 10px 2px;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }

  /* --- Preview: label peeling off the printer --- */
  .preview-wrap{
    display:flex; flex-direction:column; align-items:center;
    padding: 22px 10px 14px;
    background: radial-gradient(120% 100% at 50% 0%, #1e2024 0%, var(--bg) 65%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
  }
  .preview-wrap::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:16px;
    background: repeating-linear-gradient(90deg, #0000 0 6px, #ffffff10 6px 7px);
  }
  #labelPaper{
    background: var(--paper);
    box-shadow: 0 10px 24px -8px #000000aa, 0 0 0 1px #00000020;
    position: relative;
    border-radius: 1px;
  }
  #labelPaper .el{
    position:absolute;
    color:#111;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
    line-height: 1;
  }
  #labelPaper .barcode{
    display:flex; align-items:flex-end; gap:1px;
  }
  #labelPaper .barcode i{
    display:block; width:2px; background:#111;
  }
  #labelPaper .qr{
    display:grid;
    gap:1px;
  }
  #labelPaper .qr div{background:#111;}
  .dims{
    margin-top: 10px; font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--text-dim);
  }
  .preview-note{
    margin-top: 8px; display:flex; align-items:center; gap:6px;
    font-size: 10.5px; color: var(--amber); text-align:center; max-width: 280px;
  }
  .preview-note .warn-dot{
    width:5px;height:5px;border-radius:50%; background: var(--amber); flex:none;
  }

  .autoheight-toggle{
    display:flex; align-items:center; gap:9px; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--text); cursor:pointer; user-select:none;
  }
  .autoheight-toggle input{
    width:16px; height:16px; accent-color: var(--amber); cursor:pointer;
  }

  /* --- forms --- */
  .row{display:flex; gap:10px;}
  .field{flex:1; margin-bottom:10px;}
  label.lbl{
    display:block; font-size:11px; color: var(--text-dim); margin-bottom:5px; font-weight:600;
  }
  input[type=text], input[type=number], select{
    width:100%; background: var(--panel-2); border:1px solid var(--line); color: var(--text);
    padding: 9px 10px; border-radius: 7px; font-size:14px; font-family: inherit;
    -webkit-appearance:none; appearance:none;
  }
  select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b8e94'/></svg>");
    background-repeat:no-repeat; background-position: right 10px center;
  }
  input:focus, select:focus{outline: 2px solid var(--amber-dim); border-color: var(--amber);}
  input:disabled{opacity:.5; cursor:not-allowed;}

  .elem{
    background: var(--panel-2); border:1px solid var(--line); border-radius: 8px;
    padding: 12px; margin-bottom: 10px;
  }
  .elem-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .elem-tag{
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
    color: var(--bg); background: var(--amber); padding:3px 7px; border-radius:5px;
  }
  .icon-btn{
    background:none; border:none; color: var(--text-dim); cursor:pointer; padding:4px;
    font-size: 16px; line-height:1;
  }
  .icon-btn:hover{color: var(--danger);}

  .add-row{display:flex; gap:8px; margin-top: 4px;}
  .btn{
    flex:1; padding: 10px 12px; border-radius: 8px; border:1px dashed var(--line);
    background: transparent; color: var(--text-dim); font-size:12px; font-weight:600;
    cursor:pointer; text-align:center;
  }
  .btn:hover{border-color: var(--amber-dim); color: var(--amber);}
  .btn.active{border-style:solid; border-color: var(--amber); color: var(--amber); background: var(--amber-dim);}

  details{border:1px solid var(--line); border-radius: var(--radius); overflow:hidden;}
  summary{
    padding: 12px 14px; cursor:pointer; font-size:12px; font-weight:700; color: var(--text-dim);
    list-style:none; display:flex; justify-content:space-between; align-items:center;
  }
  summary::-webkit-details-marker{display:none;}
  pre#zplOut{
    margin:0; padding: 12px 14px; font-family:'JetBrains Mono', monospace; font-size:11.5px;
    color:#c9e8c9; background:#101114; white-space:pre-wrap; word-break:break-all; max-height: 240px; overflow:auto;
  }

  .log{
    font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--text-dim);
    background:#101114; border-radius:8px; padding:10px 12px; max-height:120px; overflow:auto;
  }
  .log div{margin-bottom:3px;}
  .log .e{color: var(--danger);}
  .log .o{color: var(--ok);}

  .bottombar{
    position: fixed; bottom:0; left:0; right:0; z-index: 20;
    background: linear-gradient(0deg, var(--bg) 60%, transparent);
    padding: 14px 16px 18px;
  }
  .bottombar-inner{
    max-width: 560px; margin:0 auto; display:flex; gap:10px; align-items:center;
  }
  .copies{
    width: 64px; text-align:center;
  }
  .primary{
    flex:1; background: var(--amber); color:#1a1204; font-weight:800; font-size:14px;
    border:none; padding: 13px 16px; border-radius: 10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .primary:disabled{background: #4a4d52; color:#8b8e94; cursor:not-allowed;}
  .secondary{
    background: var(--panel-2); color: var(--text); border:1px solid var(--line);
    font-weight:700; font-size:13px; padding: 13px 14px; border-radius: 10px; cursor:pointer;
  }

  select#dpi, select#preset{margin-bottom:0;}

  .helper{
    font-size:11px; font-family:'JetBrains Mono', monospace;
    margin: -4px 0 10px; color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16v10H4z" stroke="#1a1204" stroke-width="2"/><path d="M4 8l2-4h12l2 4" stroke="#1a1204" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <h1>Etichette</h1>
      <div class="sub">ZD621 · BLE</div>
    </div>
  </div>
  <div class="status" id="statusPill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Non connesso</span>
  </div>
</div>

<main>

  <section>
    <h2>Connessione</h2>
    <div class="card">
      <div class="add-row" style="margin-top:0;">
        <button class="btn" id="modeBleBtn">Bluetooth</button>
        <button class="btn" id="modeWifiBtn">WiFi (IP)</button>
      </div>
      <div class="field" id="wifiIpRow" style="display:none; margin:10px 0 0;">
        <label class="lbl">Indirizzo IP stampante</label>
        <input type="text" id="printerIp" placeholder="Es. 192.168.1.50" inputmode="decimal">
      </div>
      <label class="autoheight-toggle" id="bleShowAllRow" style="margin-top:10px; padding-top:10px;">
        <input type="checkbox" id="bleShowAll">
        <span>Mostra tutti i dispositivi Bluetooth (diagnostica)</span>
      </label>
    </div>
  </section>

  <section>
    <h2>Anteprima</h2>
    <div class="preview-wrap">
      <div id="labelPaper"></div>
      <div class="dims" id="dimsText"></div>
      <div class="preview-note"><span class="warn-dot"></span>Anteprima indicativa — QR e codici a barre reali generati dalla stampante</div>
    </div>
  </section>

  <section>
    <h2>Formato etichetta</h2>
    <div class="card">
      <div class="row">
        <div class="field">
          <label class="lbl">Preset</label>
          <select id="preset">
            <option value="40x30">40 × 30 mm</option>
            <option value="50x30">50 × 30 mm</option>
            <option value="57x32">57 × 32 mm</option>
            <option value="60x40">60 × 40 mm</option>
            <option value="102x152">102 × 152 mm (spedizione)</option>
            <option value="custom">Personalizzato</option>
          </select>
        </div>
        <div class="field">
          <label class="lbl">Risoluzione</label>
          <select id="dpi">
            <option value="203">203 dpi</option>
            <option value="300">300 dpi</option>
          </select>
        </div>
      </div>
      <div class="row" id="customRow" style="display:none;">
        <div class="field">
          <label class="lbl">Larghezza (mm)</label>
          <input type="number" id="widthMm" value="40" min="10" max="200">
        </div>
        <div class="field">
          <label class="lbl">Altezza (mm)</label>
          <input type="number" id="heightMm" value="30" min="10" max="300">
        </div>
      </div>
      <label class="autoheight-toggle" id="autoHeightRow">
        <input type="checkbox" id="autoHeight" checked>
        <span>Adatta automaticamente l'altezza al contenuto</span>
      </label>
    </div>
  </section>

  <section>
    <h2>Contenuto</h2>
    <div id="elementsList"></div>
    <div class="add-row">
      <button class="btn" data-add="text">+ Testo</button>
      <button class="btn" data-add="ean">+ Codice EAN-13</button>
      <button class="btn" data-add="qr">+ QR code</button>
    </div>
  </section>

  <section>
    <h2>Modello etichetta</h2>
    <div class="add-row">
      <button class="btn" id="exportBtn">↓ Esporta modello</button>
      <button class="btn" id="importBtn">↑ Importa modello</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
  </section>

  <section>
    <details>
      <summary>Codice ZPL generato <span>▾</span></summary>
      <pre id="zplOut"></pre>
    </details>
  </section>

  <section>
    <h2>Log</h2>
    <div class="log" id="log"><div>Pronto. Collega la stampante per iniziare.</div></div>
  </section>

</main>

<div class="bottombar">
  <div class="bottombar-inner">
    <button class="secondary" id="connectBtn">Collega</button>
    <input type="number" class="copies" id="copies" value="1" min="1" max="50" title="Copie">
    <button class="primary" id="printBtn" disabled>
      <span>Stampa</span>
    </button>
  </div>
</div>

<script>
(function(){
  // ---------- state ----------
  const state = {
    widthMm: 40, heightMm: 30, dpi: 203, autoHeight: true,
    elements: [], // {id, type, x, y, content, size}
    device: null, char: null,
    nextId: 1,
  };

  const PRESETS = {
    '40x30':[40,30], '50x30':[50,30], '57x32':[57,32], '60x40':[60,40], '102x152':[102,152]
  };

  function uid(){ return 'e' + (state.nextId++); }

  // EAN-13 check digit: pesi alternati 1/3 sulle prime 12 cifre
  function ean13CheckDigit(digits12){
    let sum = 0;
    for(let i=0;i<12;i++){
      const d = parseInt(digits12[i],10) || 0;
      sum += (i % 2 === 0) ? d : d * 3;
    }
    return (10 - (sum % 10)) % 10;
  }

  function addDefaultElements(){
    state.elements = [
      { id: uid(), type:'text', x:3, y:3, content:'SUSHI DAILY', size:5 },
      { id: uid(), type:'text', x:3, y:11, content:'Prodotto del giorno', size:3.2 },
    ];
  }
  addDefaultElements();

  // ---------- DOM refs ----------
  const $ = (id) => document.getElementById(id);
  const presetSel = $('preset'), dpiSel = $('dpi'), customRow = $('customRow');
  const widthInp = $('widthMm'), heightInp = $('heightMm');
  const elementsList = $('elementsList');
  const labelPaper = $('labelPaper');
  const dimsText = $('dimsText');
  const zplOut = $('zplOut');
  const logEl = $('log');
  const statusDot = $('statusDot'), statusText = $('statusText');
  const connectBtn = $('connectBtn'), printBtn = $('printBtn');
  const copiesInp = $('copies');
  const autoHeightChk = $('autoHeight');
  const exportBtn = $('exportBtn'), importBtn = $('importBtn'), importFile = $('importFile');
  const modeBleBtn = $('modeBleBtn'), modeWifiBtn = $('modeWifiBtn'), wifiIpRow = $('wifiIpRow'), printerIpInp = $('printerIp');
  const bleShowAllRow = $('bleShowAllRow'), bleShowAllChk = $('bleShowAll');
  const subEl = document.querySelector('.brand .sub');

  function log(msg, cls){
    const d = document.createElement('div');
    if(cls) d.className = cls;
    const t = new Date().toLocaleTimeString('it-IT', {hour12:false});
    d.textContent = `[${t}] ${msg}`;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ---------- size controls ----------
  presetSel.addEventListener('change', () => {
    if(presetSel.value === 'custom'){
      customRow.style.display = 'flex';
    } else {
      customRow.style.display = 'none';
      const [w,h] = PRESETS[presetSel.value];
      state.widthMm = w; state.heightMm = h;
      widthInp.value = w; heightInp.value = h;
      render();
    }
  });
  widthInp.addEventListener('input', () => { state.widthMm = parseFloat(widthInp.value)||40; render(); });
  heightInp.addEventListener('input', () => { if(!state.autoHeight){ state.heightMm = parseFloat(heightInp.value)||30; render(); } });
  dpiSel.addEventListener('change', () => { state.dpi = parseInt(dpiSel.value); render(); });
  autoHeightChk.addEventListener('change', () => { state.autoHeight = autoHeightChk.checked; render(); });

  function nextY(){
    if(state.elements.length === 0) return 3;
    let maxBottom = 0;
    state.elements.forEach(el => {
      let h;
      if(el.type === 'text') h = el.size * 1.15;
      else if(el.type === 'ean') h = el.size + 3.2;
      else h = el.size;
      const bottom = el.y + (h || 5);
      if(bottom > maxBottom) maxBottom = bottom;
    });
    return Math.round((maxBottom + 2) * 2) / 2;
  }

  // ---------- elements editor ----------
  document.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.getAttribute('data-add');
      const base = { id: uid(), x: 3, y: nextY(), type };
      if(type === 'text') Object.assign(base, {content:'Testo', size:4});
      if(type === 'ean') Object.assign(base, {content:'', size:12});
      if(type === 'qr') Object.assign(base, {content:'https://', size:15});
      state.elements.push(base);
      renderElementsList();
      render();
    });
  });

  function renderElementsList(){
    elementsList.innerHTML = '';
    state.elements.forEach(el => {
      const wrap = document.createElement('div');
      wrap.className = 'elem';

      const tagName = el.type === 'text' ? 'Testo' : el.type === 'ean' ? 'Codice EAN-13' : 'QR code';
      const contentLabel = el.type === 'text' ? 'Contenuto' : el.type === 'ean' ? 'Codice EAN (12 cifre)' : 'Dati / URL';
      const extraAttrs = el.type === 'ean' ? 'inputmode="numeric" pattern="[0-9]*" maxlength="13" placeholder="Es. 8006381333930"' : '';
      wrap.innerHTML = `
        <div class="elem-head">
          <span class="elem-tag">${tagName}</span>
          <button class="icon-btn" data-del="${el.id}">✕</button>
        </div>
        <div class="field" style="margin-bottom:${el.type === 'ean' ? '2px' : '8px'};">
          <label class="lbl">${contentLabel}</label>
          <input type="text" data-field="content" data-id="${el.id}" value="${escapeAttr(el.content)}" ${extraAttrs}>
        </div>
        ${el.type === 'ean' ? `<div class="helper" id="eanHelper-${el.id}"></div>` : ''}
        <div class="row">
          <div class="field">
            <label class="lbl">X (mm)</label>
            <input type="number" data-field="x" data-id="${el.id}" value="${el.x}" step="0.5">
          </div>
          <div class="field">
            <label class="lbl">Y (mm)</label>
            <input type="number" data-field="y" data-id="${el.id}" value="${el.y}" step="0.5">
          </div>
          <div class="field">
            <label class="lbl">${el.type === 'text' ? 'Dim. testo (mm)' : el.type === 'ean' ? 'Altezza barre (mm)' : 'Dimensione (mm)'}</label>
            <input type="number" data-field="size" data-id="${el.id}" value="${el.size}" step="0.5">
          </div>
        </div>
      `;
      elementsList.appendChild(wrap);
      if(el.type === 'ean') updateEanHelper(el);
    });

    elementsList.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        const id = inp.getAttribute('data-id');
        const field = inp.getAttribute('data-field');
        const el = state.elements.find(e => e.id === id);
        if(!el) return;
        if(field === 'content' && el.type === 'ean'){
          const digits = inp.value.replace(/\D/g,'').slice(0,13);
          inp.value = digits;
          el.content = digits;
          updateEanHelper(el);
        } else {
          el[field] = (field === 'content') ? inp.value : (parseFloat(inp.value)||0);
        }
        render();
      });
    });
    elementsList.querySelectorAll('[data-del]').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-del');
        state.elements = state.elements.filter(e => e.id !== id);
        renderElementsList();
        render();
      });
    });
  }

  function updateEanHelper(el){
    const helper = document.getElementById('eanHelper-' + el.id);
    if(!helper) return;
    const digits = String(el.content || '').replace(/\D/g,'').slice(0,12);
    if(digits.length < 12){
      helper.textContent = `Mancano ${12 - digits.length} cifre`;
      helper.style.color = 'var(--danger)';
    } else {
      const check = ean13CheckDigit(digits);
      helper.textContent = `Codice completo: ${digits}${check} (cifra di controllo: ${check})`;
      helper.style.color = 'var(--ok)';
    }
  }

  function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

  // ---------- preview rendering ----------
  const PREVIEW_SCALE = 4.2; // px per mm on screen

  function computeAutoHeight(){
    let maxBottom = 0;
    state.elements.forEach(el => {
      let h;
      if(el.type === 'text') h = el.size * 1.15;
      else if(el.type === 'ean') h = el.size + 3.2; // barre + riga leggibile
      else h = el.size; // qr
      const bottom = el.y + (h || 5);
      if(bottom > maxBottom) maxBottom = bottom;
    });
    return Math.max(10, Math.round((maxBottom + 3) * 2) / 2); // + margine, arrotondato a 0.5mm
  }

  function render(){
    if(state.autoHeight){
      state.heightMm = computeAutoHeight();
      heightInp.value = state.heightMm;
      heightInp.disabled = true;
    } else {
      heightInp.disabled = false;
    }

    // paper size
    const pw = state.widthMm * PREVIEW_SCALE;
    const ph = state.heightMm * PREVIEW_SCALE;
    labelPaper.style.width = pw + 'px';
    labelPaper.style.height = ph + 'px';
    labelPaper.innerHTML = '';

    state.elements.forEach(el => {
      const box = document.createElement('div');
      box.className = 'el';
      box.style.left = (el.x * PREVIEW_SCALE) + 'px';
      box.style.top = (el.y * PREVIEW_SCALE) + 'px';

      if(el.type === 'text'){
        box.style.fontSize = (el.size * PREVIEW_SCALE * 0.9) + 'px';
        box.style.fontWeight = '600';
        box.textContent = el.content;
        labelPaper.appendChild(box);
      } else if(el.type === 'ean'){
        const barsDiv = document.createElement('div');
        barsDiv.className = 'barcode';
        barsDiv.style.height = (el.size * PREVIEW_SCALE) + 'px';
        const digits = String(el.content || '').replace(/\D/g,'').padEnd(12,'0').slice(0,12);
        const full = digits + ean13CheckDigit(digits);
        const bars = 59; // approssimazione dei 95 moduli reali di un EAN-13
        for(let i=0;i<bars;i++){
          const bar = document.createElement('i');
          const isGuard = i < 3 || i >= bars - 3 || (i > bars/2 - 2 && i < bars/2 + 2);
          const d = parseInt(full[i % full.length], 10) || 0;
          bar.style.height = (isGuard ? 100 : 50 + d * 4) + '%';
          barsDiv.appendChild(bar);
        }
        box.appendChild(barsDiv);
        const codeText = document.createElement('div');
        codeText.style.cssText = `font-size:${2.6*PREVIEW_SCALE}px; margin-top:2px; letter-spacing:1px;`;
        codeText.textContent = full;
        box.appendChild(codeText);
        labelPaper.appendChild(box);
      } else if(el.type === 'qr'){
        const dim = Math.max(8, Math.round(el.size * PREVIEW_SCALE / 4));
        box.classList.add('qr');
        box.style.width = (el.size * PREVIEW_SCALE) + 'px';
        box.style.height = (el.size * PREVIEW_SCALE) + 'px';
        box.style.gridTemplateColumns = `repeat(${dim}, 1fr)`;
        box.style.gridTemplateRows = `repeat(${dim}, 1fr)`;
        // pseudo-random but deterministic pattern from content
        let seed = 0;
        for(const c of String(el.content||'')) seed = (seed*31 + c.charCodeAt(0)) % 997;
        for(let i=0;i<dim*dim;i++){
          seed = (seed * 1103515245 + 12345) % 2147483648;
          const cell = document.createElement('div');
          if((seed % 5) < 2) cell.style.background = 'transparent';
          box.appendChild(cell);
        }
        labelPaper.appendChild(box);
      }
    });

    dimsText.textContent = `${state.widthMm} × ${state.heightMm} mm · ${state.dpi} dpi · ${mmToDots(state.widthMm)} × ${mmToDots(state.heightMm)} px`;
    zplOut.textContent = generateZPL();
  }

  function mmToDots(mm){
    return Math.round(mm * state.dpi / 25.4);
  }

  // ---------- ZPL generation ----------
  function zplEscape(s){
    return String(s).replace(/\^/g,'').replace(/~/g,'');
  }

  function generateZPL(){
    const w = mmToDots(state.widthMm);
    const h = mmToDots(state.heightMm);
    const copies = Math.max(1, parseInt(copiesInp.value)||1);
    let out = '';
    out += '^XA\n';
    out += '^CI28\n'; // UTF-8
    out += `^PW${w}\n`;
    out += `^LL${h}\n`;

    state.elements.forEach(el => {
      const x = mmToDots(el.x);
      const y = mmToDots(el.y);
      if(el.type === 'text'){
        const fh = mmToDots(el.size);
        out += `^FO${x},${y}^A0N,${fh},${fh}^FD${zplEscape(el.content)}^FS\n`;
      } else if(el.type === 'ean'){
        const bh = mmToDots(el.size);
        const digits = String(el.content || '').replace(/\D/g,'').padEnd(12,'0').slice(0,12);
        // ^BE = EAN-13: 12 cifre in ^FD, la stampante calcola e stampa la cifra di controllo
        out += `^FO${x},${y}^BY2^BEN,${bh},Y,N^FD${digits}^FS\n`;
      } else if(el.type === 'qr'){
        const mag = Math.max(1, Math.min(10, Math.round(el.size / 6)));
        out += `^FO${x},${y}^BQN,2,${mag}^FDQA,${zplEscape(el.content)}^FS\n`;
      }
    });

    out += `^PQ${copies}\n`;
    out += '^XZ';
    return out;
  }

  copiesInp.addEventListener('input', () => { zplOut.textContent = generateZPL(); });

  // ---------- connection mode (Bluetooth / WiFi) ----------
  state.connMode = localStorage.getItem('connMode') === 'wifi' ? 'wifi' : 'ble';
  state.printerIp = localStorage.getItem('printerIp') || '';
  state.wifiConnected = false;
  printerIpInp.value = state.printerIp;

  function applyModeUI(){
    modeBleBtn.classList.toggle('active', state.connMode === 'ble');
    modeWifiBtn.classList.toggle('active', state.connMode === 'wifi');
    wifiIpRow.style.display = state.connMode === 'wifi' ? 'block' : 'none';
    bleShowAllRow.style.display = state.connMode === 'ble' ? 'flex' : 'none';
    subEl.textContent = state.connMode === 'ble' ? 'ZD621 · BLE' : 'ZD621 · WiFi';
  }
  applyModeUI();

  function setMode(mode){
    if(state.connMode === mode) return;
    if(state.device && state.device.gatt && state.device.gatt.connected) state.device.gatt.disconnect();
    state.connMode = mode;
    localStorage.setItem('connMode', mode);
    applyModeUI();
    onDisconnected();
  }
  modeBleBtn.addEventListener('click', () => setMode('ble'));
  modeWifiBtn.addEventListener('click', () => setMode('wifi'));
  printerIpInp.addEventListener('input', () => {
    state.printerIp = printerIpInp.value.trim();
    localStorage.setItem('printerIp', state.printerIp);
  });

  function friendlyWifiError(err){
    const base = err && err.message ? err.message : String(err);
    if(/Failed to fetch|NetworkError|Load failed/i.test(base)){
      return base + ' — probabile blocco "contenuto misto": questa pagina è HTTPS e la stampante è HTTP sulla rete locale. Chrome blocca la richiesta per sicurezza.';
    }
    return base;
  }

  async function sendZPLWifi(zpl){
    const ip = state.printerIp;
    if(!ip) throw new Error('Indirizzo IP mancante.');
    await fetch(`http://${ip}/pstprnt`, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: zpl,
      signal: AbortSignal.timeout(6000)
    });
  }

  // ---------- Web Bluetooth ----------
  const SERVICE_UUID_FULL = '38eb4a80-c570-11e3-9507-0002a5d5c51b';
  const WRITE_CHAR_UUID = '38eb4a82-c570-11e3-9507-0002a5d5c51b';
  const SERVICE_UUID_SHORT = '0000fe79-0000-1000-8000-00805f9b34fb';

  function setStatus(state_, text){
    statusDot.className = 'dot' + (state_ ? ' ' + state_ : '');
    statusText.textContent = text;
  }

  connectBtn.addEventListener('click', async () => {
    if(state.connMode === 'wifi'){
      if(state.wifiConnected){
        state.wifiConnected = false;
        onDisconnected();
        return;
      }
      const ip = state.printerIp;
      if(!ip){ log('Inserisci l\'indirizzo IP della stampante.', 'e'); return; }
      setStatus(null, 'Verifica…');
      try{
        // richiesta "no-cors": non possiamo leggere l'esito, solo se la rete è raggiungibile
        await fetch(`http://${ip}/`, { mode: 'no-cors', signal: AbortSignal.timeout(4000) });
        state.wifiConnected = true;
        setStatus('on', ip);
        connectBtn.textContent = 'Disconnetti';
        printBtn.disabled = false;
        log(`Stampante raggiungibile su ${ip} (verifica di rete limitata dal browser).`, 'o');
      } catch(err){
        log('Stampante non raggiungibile: ' + friendlyWifiError(err), 'e');
        setStatus('err', 'Non raggiungibile');
      }
      return;
    }

    if(state.device && state.device.gatt.connected){
      state.device.gatt.disconnect();
      return;
    }
    if(!navigator.bluetooth){
      log('Web Bluetooth non disponibile in questo browser. Usa Chrome su Android.', 'e');
      setStatus('err', 'Non supportato');
      return;
    }
    const showAll = bleShowAllChk.checked;
    try{
      log(showAll ? 'Ricerca — mostro tutti i dispositivi nelle vicinanze…' : 'Ricerca stampante nelle vicinanze…');
      const requestOpts = showAll
        ? { acceptAllDevices: true, optionalServices: [SERVICE_UUID_FULL, SERVICE_UUID_SHORT] }
        : {
            filters: [
              { services: [SERVICE_UUID_SHORT] },
              { namePrefix: 'ZD621' },
              { namePrefix: 'Zebra' }
            ],
            optionalServices: [SERVICE_UUID_FULL, SERVICE_UUID_SHORT]
          };
      const device = await navigator.bluetooth.requestDevice(requestOpts);
      state.device = device;
      log(`Selezionata: ${device.name || 'dispositivo senza nome'} (${device.id})`);
      device.addEventListener('gattserverdisconnected', onDisconnected);

      setStatus(null, 'Connessione…');
      const server = await device.gatt.connect();
      let service;
      try{
        service = await server.getPrimaryService(SERVICE_UUID_FULL);
      } catch(svcErr){
        throw new Error(`connesso a "${device.name || 'dispositivo'}" ma non espone il servizio della stampante — probabilmente non è la ZD621`);
      }
      const characteristic = await service.getCharacteristic(WRITE_CHAR_UUID);
      state.char = characteristic;

      setStatus('on', device.name || 'Connesso');
      connectBtn.textContent = 'Disconnetti';
      printBtn.disabled = false;
      log('Connessa alla stampante.', 'o');
    } catch(err){
      log('Connessione fallita: ' + err.message, 'e');
      setStatus('err', 'Errore connessione');
    }
  });

  function onDisconnected(){
    setStatus(null, 'Non connesso');
    connectBtn.textContent = 'Collega';
    printBtn.disabled = true;
    state.char = null;
    state.wifiConnected = false;
    log('Disconnesso.');
  }

  printBtn.addEventListener('click', async () => {
    if(state.connMode === 'wifi' ? !state.wifiConnected : !state.char){
      log('Nessuna stampante connessa.', 'e');
      return;
    }
    const zpl = generateZPL();
    try{
      printBtn.disabled = true;
      printBtn.querySelector('span').textContent = 'Invio…';
      if(state.connMode === 'wifi'){
        await sendZPLWifi(zpl);
      } else {
        await sendZPL(zpl);
      }
      log('Etichetta inviata alla stampante.', 'o');
    } catch(err){
      const msg = state.connMode === 'wifi' ? friendlyWifiError(err) : err.message;
      log('Errore durante la stampa: ' + msg, 'e');
    } finally{
      printBtn.disabled = false;
      printBtn.querySelector('span').textContent = 'Stampa';
    }
  });

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function sendZPL(zpl){
    const bytes = new TextEncoder().encode(zpl);
    const CHUNK = 180; // stay well under the 512-byte link-layer limit
    const useWithoutResponse = !!state.char.writeValueWithoutResponse;
    for(let i=0; i<bytes.length; i+=CHUNK){
      const chunk = bytes.slice(i, i+CHUNK);
      if(useWithoutResponse){
        await state.char.writeValueWithoutResponse(chunk);
        await sleep(15); // dà tempo al buffer di ricezione della stampante di svuotarsi
      } else {
        await state.char.writeValue(chunk);
      }
    }
    // margine perché la stampante finisca di elaborare l'ultimo pacchetto (^XZ incluso)
    // prima che l'app o l'utente disconnettano — un invio troncato lascia un comando
    // ZPL aperto e la stampante "in attesa", il che può confondere altri software finché non si riavvia
    await sleep(400);
  }

  // ---------- import / export modello ----------
  exportBtn.addEventListener('click', () => {
    const payload = {
      formatVersion: 1,
      widthMm: state.widthMm,
      heightMm: state.heightMm,
      dpi: state.dpi,
      autoHeight: state.autoHeight,
      copies: parseInt(copiesInp.value) || 1,
      elements: state.elements.map(({id, ...rest}) => rest)
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const firstText = state.elements.find(e => e.type === 'text');
    const safeName = (firstText ? firstText.content : 'etichetta')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30) || 'etichetta';
    const a = document.createElement('a');
    a.href = url;
    a.download = `${safeName}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    log(`Modello esportato: "${safeName}.json".`, 'o');
  });

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', async () => {
    const file = importFile.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || !Array.isArray(data.elements)) throw new Error('file non valido');

      state.widthMm = parseFloat(data.widthMm) || 40;
      state.heightMm = parseFloat(data.heightMm) || 30;
      state.dpi = parseInt(data.dpi) === 300 ? 300 : 203;
      state.autoHeight = data.autoHeight !== false;
      state.elements = data.elements.map(e => ({
        id: uid(),
        type: (e.type === 'ean' || e.type === 'qr') ? e.type : 'text',
        x: parseFloat(e.x) || 0,
        y: parseFloat(e.y) || 0,
        content: String(e.content || ''),
        size: parseFloat(e.size) || 5
      }));
      if(parseInt(data.copies)) copiesInp.value = parseInt(data.copies);

      // sincronizza i controlli con lo stato importato
      dpiSel.value = String(state.dpi);
      autoHeightChk.checked = state.autoHeight;
      presetSel.value = 'custom';
      customRow.style.display = 'flex';
      widthInp.value = state.widthMm;
      heightInp.value = state.heightMm;

      renderElementsList();
      render();
      log(`Modello importato da "${file.name}".`, 'o');
    } catch(err){
      log('Importazione fallita: ' + err.message, 'e');
    } finally{
      importFile.value = '';
    }
  });

  // ---------- init ----------
  widthInp.value = state.widthMm;
  heightInp.value = state.heightMm;
  renderElementsList();
  render();
})();
</script>
</body>
</html>
